<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TechSched</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-shell" id="appShell">
    <!-- Resize Handles for Frameless Window -->
    <div class="resize-handle resize-top" data-edge="n"></div>
    <div class="resize-handle resize-bottom" data-edge="s"></div>
    <div class="resize-handle resize-left" data-edge="w"></div>
    <div class="resize-handle resize-right" data-edge="e"></div>
    <div class="resize-handle resize-top-left" data-edge="nw"></div>
    <div class="resize-handle resize-top-right" data-edge="ne"></div>
    <div class="resize-handle resize-bottom-left" data-edge="sw"></div>
    <div class="resize-handle resize-bottom-right" data-edge="se"></div>

    <!-- Custom Frameless Titlebar -->
    <header class="window-titlebar" id="windowTitlebar">
      <div class="titlebar-drag-area">
        <div class="titlebar-brand">
          <img src="assets/logo.png" alt="" class="titlebar-logo">
          <span class="titlebar-title">TechSched</span>
        </div>
      </div>
      <div class="window-controls">
        <button class="win-btn win-min" id="btnWinMin" title="Minimize" aria-label="Minimize">
          <svg width="10" height="2" viewBox="0 0 10 2">
            <path d="M0 1h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
        <button class="win-btn win-max" id="btnWinMax" title="Maximize" aria-label="Maximize">
          <svg id="iconMax" width="10" height="10" viewBox="0 0 10 10">
            <rect x="0.5" y="0.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" />
          </svg>
          <svg id="iconRestore" class="hidden" width="10" height="10" viewBox="0 0 10 10">
            <path d="M2.5 0.5h7v7M0.5 2.5h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.1" />
          </svg>
        </button>
        <button class="win-btn win-close" id="btnWinClose" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar glass-sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="TechSched Logo" class="app-logo-img">
          <div class="brand-text">
            <div class="brand-title">TechSched</div>
            <small class="brand-sub">Schedule Generator</small>
          </div>
        </div>

        <nav class="ios-nav">
          <button class="nav active" data-view="new">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Schedule</span>
          </button>
          <button class="nav" data-view="history">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>History</span>
          </button>
          <button class="nav" data-view="team">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Members & Positions</span>
          </button>
          <button class="nav" data-view="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
            <span>Settings</span>
            <span id="settingsUpdateDot" class="update-nav-pill hidden" title="Update ready"></span>
          </button>
        </nav>

        <div class="folder-box">
          <div class="folder-title"><small>Saving to</small></div>
          <div id="folderLabel" class="path"></div>
          <button id="btnPickFolder" class="btn ghost btn-sm">Select folder</button>
        </div>
      </aside>

      <main>
        <section id="view-new" class="view"></section>
        <section id="view-history" class="view hidden"></section>
        <section id="view-team" class="view hidden"></section>
        <section id="view-settings" class="view hidden"></section>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toasts"></div>
  </div>

  <script src="../lib/layout.js"></script>
  <script src="app.js"></script>
</body>

</html>
